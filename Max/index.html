<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Max()</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>

<body>
   <div class="parent">
      <div class="line"></div>
      <p>Parent (window) width: <span class="window"></span></p>
      <div class="line"></div>
   </div>

   <h1><code>CSS max() function<a class="support" href="https://caniuse.com/#feat=mdn-css_types_max">?</a></code></h1>

   <p><code class="value">width: max(<span class="max">50%</span>, <span class="min">400px</span>);</code></p>

   <div class="element">
      <p>Element actual width: <span class="actual"></span></p>
   </div>
</body>

</html>
